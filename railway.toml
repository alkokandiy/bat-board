[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "frontend/**"]

[deploy]
preDeployCommand = "alembic upgrade head"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/health"
healthcheckTimeout = 30

# Environment variables are NOT configured here: Railway's config-as-code
# does not apply variable blocks, so values that used to live in this file
# (including placeholder secrets) never reached the service. Set them in the
# Railway dashboard → Variables. Required: SECRET_KEY,
# PROVIDER_KEY_ENCRYPTION_SECRET, DATABASE_URL, TELEGRAM_BOT_TOKEN,
# TELEGRAM_WEBHOOK_SECRET. Optional: LOG_FORMAT=json (structured logs),
# WEB_CONCURRENCY (gunicorn workers, default 1), CORS_ORIGINS (only for a
# frontend served from another origin; the bundled SPA needs none).
