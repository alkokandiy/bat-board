[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "frontend/**"]

[deploy]
preDeployCommand = "sh -c 'alembic upgrade head'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/health"
healthcheckTimeout = 30

[[service.variables]]
key = "ENVIRONMENT"
value = "production"

[[service.variables]]
key = "LOG_FORMAT"
value = "json"

[[service.variables]]
key = "CORS_ORIGINS"
value = '["*"]'

[[service.variables]]
key = "SECRET_KEY"
value = "set-this-to-a-random-64-char-string-in-railway"

# Single-user: 1 worker (was 4). Does not touch the database.
[[service.variables]]
key = "WEB_CONCURRENCY"
value = "1"