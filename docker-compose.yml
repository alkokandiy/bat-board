services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: batboard
      POSTGRES_PASSWORD: batboard
      POSTGRES_DB: batboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://batboard:batboard@db:5432/batboard
      ENVIRONMENT: development
      SECRET_KEY: dev-secret-key-change-in-production-min32chars
      CORS_ORIGINS: '["http://localhost:5173"]'
      LOG_FORMAT: console
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./frontend/dist:/app/static

  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  pgdata: